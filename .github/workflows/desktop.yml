name: Desktop

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: Minutes to keep the desktop tunnel open
        required: false
        default: '340'
        type: string
  push:
    branches:
      - fix/novnc-remote-smoke
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require secrets
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
          RUNNER_TARGET_REPOSITORY: ${{ secrets.RUNNER_TARGET_REPOSITORY }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DESKTOP_PASSWORD" || { echo "::error::Missing DESKTOP_PASSWORD"; exit 1; }
          test -n "$RUNNER_TARGET_REPOSITORY" || { echo "::error::Missing RUNNER_TARGET_REPOSITORY"; exit 1; }
          test -n "$RUNNER_ADMIN_TOKEN" || { echo "::error::Missing RUNNER_ADMIN_TOKEN"; exit 1; }

      - name: Install native desktop and development tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_OPTS=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
          sudo apt-get "${APT_OPTS[@]}" update
          sudo apt-get "${APT_OPTS[@]}" install -y \
            apache2-utils \
            ca-certificates \
            curl \
            dbus-x11 \
            fonts-noto-cjk \
            jq \
            nginx \
            novnc \
            thunar \
            tigervnc-standalone-server \
            websockify \
            wget \
            xfce4-panel \
            xfce4-session \
            xfce4-terminal \
            xfdesktop4 \
            xfwm4

          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              -o /tmp/google-chrome.deb
            sudo apt-get "${APT_OPTS[@]}" install -y /tmp/google-chrome.deb
          fi

          if ! command -v code >/dev/null 2>&1; then
            curl -fL --connect-timeout 15 --max-time 180 --retry 3 \
              https://update.code.visualstudio.com/latest/linux-deb-x64/stable \
              -o /tmp/vscode.deb
            sudo apt-get "${APT_OPTS[@]}" install -y /tmp/vscode.deb
          fi

      - name: Configure native XFCE desktop
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          set -euo pipefail

          DESKTOP_USER="$(id -un)"
          DESKTOP_HOME="$HOME"

          sudo tee /etc/systemd/system/desktop-x.service >/dev/null <<EOF
          [Unit]
          Description=Ephemeral desktop X server
          After=network.target

          [Service]
          Type=simple
          User=${DESKTOP_USER}
          Environment=HOME=${DESKTOP_HOME}
          ExecStart=/usr/bin/Xtigervnc :1 -localhost yes -rfbport 5901 -SecurityTypes None -geometry 1920x1080 -depth 24 -AlwaysShared
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo tee /etc/systemd/system/desktop-xfce.service >/dev/null <<EOF
          [Unit]
          Description=Ephemeral XFCE session
          Requires=desktop-x.service
          After=desktop-x.service

          [Service]
          Type=simple
          User=${DESKTOP_USER}
          Environment=HOME=${DESKTOP_HOME}
          Environment=DISPLAY=:1
          ExecStart=/usr/bin/dbus-run-session -- /usr/bin/startxfce4
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo tee /etc/systemd/system/desktop-novnc.service >/dev/null <<'EOF'
          [Unit]
          Description=Ephemeral noVNC websocket bridge
          Requires=desktop-x.service
          After=desktop-x.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/websockify 127.0.0.1:6080 127.0.0.1:5901
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo htpasswd -bc /etc/nginx/.desktop-htpasswd admin "$DESKTOP_PASSWORD" >/dev/null
          sudo tee /etc/nginx/sites-available/desktop >/dev/null <<'EOF'
          server {
              listen 127.0.0.1:3000;
              server_name _;

              auth_basic "Development desktop";
              auth_basic_user_file /etc/nginx/.desktop-htpasswd;

              location = / {
                  return 302 /vnc.html?autoconnect=true&resize=remote&path=websockify;
              }

              location /websockify {
                  proxy_pass http://127.0.0.1:6080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
              }

              location / {
                  root /usr/share/novnc;
                  try_files $uri $uri/ =404;
              }
          }
          EOF

          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/desktop /etc/nginx/sites-enabled/desktop
          sudo nginx -t
          sudo systemctl daemon-reload
          sudo systemctl restart nginx

          # systemd After= only orders process startup. It does not mean Xtigervnc
          # is already listening, so do not start XFCE/websockify until RFB is ready.
          sudo systemctl start desktop-x.service
          vnc_ready=0
          for attempt in {1..30}; do
            if python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(("127.0.0.1", 5901), timeout=1) as s:
                  banner = s.recv(12)
              raise SystemExit(0 if banner.startswith(b"RFB ") else 1)
          except OSError:
              raise SystemExit(1)
          PY
            then
              vnc_ready=1
              break
            fi
            sleep 1
          done

          if [ "$vnc_ready" -ne 1 ]; then
            sudo systemctl status desktop-x.service --no-pager -l || true
            sudo journalctl -u desktop-x.service --no-pager -n 100 || true
            exit 1
          fi

          sudo systemctl start desktop-xfce.service desktop-novnc.service

          # systemd can report the websockify unit active before its TCP listener
          # is accepting connections. Wait for 6080 explicitly so the next smoke
          # step cannot race the websocket bridge startup.
          novnc_ready=0
          for attempt in {1..30}; do
            if python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(("127.0.0.1", 6080), timeout=1):
                  pass
              raise SystemExit(0)
          except OSError:
              raise SystemExit(1)
          PY
            then
              novnc_ready=1
              break
            fi
            sleep 1
          done

          if [ "$novnc_ready" -ne 1 ]; then
            sudo systemctl status desktop-novnc.service --no-pager -l || true
            sudo journalctl -u desktop-novnc.service --no-pager -n 100 || true
            exit 1
          fi

          desktop_ready=0
          for attempt in {1..30}; do
            if curl -fsS -u "admin:${DESKTOP_PASSWORD}" \
                 http://127.0.0.1:3000/vnc.html >/dev/null && \
               curl -fsS -u "admin:${DESKTOP_PASSWORD}" \
                 http://127.0.0.1:3000/app/ui.js >/dev/null && \
               sudo systemctl is-active --quiet desktop-x.service && \
               sudo systemctl is-active --quiet desktop-xfce.service && \
               sudo systemctl is-active --quiet desktop-novnc.service; then
              desktop_ready=1
              break
            fi
            sleep 1
          done

          if [ "$desktop_ready" -ne 1 ]; then
            sudo systemctl status desktop-x.service desktop-xfce.service desktop-novnc.service nginx --no-pager -l || true
            sudo journalctl -u desktop-x.service -u desktop-xfce.service -u desktop-novnc.service --no-pager -n 100 || true
            exit 1
          fi

      - name: Verify noVNC path
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          set -euo pipefail

          curl -fsS -u "admin:${DESKTOP_PASSWORD}" \
            http://127.0.0.1:3000/vnc.html >/dev/null
          curl -fsS -u "admin:${DESKTOP_PASSWORD}" \
            http://127.0.0.1:3000/app/ui.js >/dev/null

          python3 - <<'PY'
          import socket
          s = socket.create_connection(("127.0.0.1", 5901), timeout=5)
          banner = s.recv(12)
          s.close()
          if not banner.startswith(b"RFB "):
              raise SystemExit(f"unexpected VNC banner: {banner!r}")
          print(banner.decode("ascii", errors="replace").strip())
          PY

          BASIC_AUTH="$(printf 'admin:%s' "$DESKTOP_PASSWORD" | base64 -w0)"
          BASIC_AUTH="$BASIC_AUTH" python3 - <<'PY'
          import base64
          import os
          import socket
          import time

          auth = os.environ["BASIC_AUTH"]
          last_status = b""
          last_error = None

          for attempt in range(30):
              key = base64.b64encode(os.urandom(16)).decode("ascii")
              request = (
                  "GET /websockify HTTP/1.1\r\n"
                  "Host: 127.0.0.1\r\n"
                  "Upgrade: websocket\r\n"
                  "Connection: Upgrade\r\n"
                  f"Sec-WebSocket-Key: {key}\r\n"
                  "Sec-WebSocket-Version: 13\r\n"
                  "Sec-WebSocket-Protocol: binary\r\n"
                  f"Authorization: Basic {auth}\r\n"
                  "\r\n"
              ).encode("ascii")

              try:
                  with socket.create_connection(("127.0.0.1", 3000), timeout=5) as s:
                      s.sendall(request)
                      response = s.recv(4096)
                  status = response.split(b"\r\n", 1)[0]
                  last_status = status
                  if b" 101 " in status:
                      print(status.decode("ascii", errors="replace"))
                      break
              except OSError as exc:
                  last_error = exc

              time.sleep(1)
          else:
              if last_status:
                  raise SystemExit(f"websocket upgrade failed: {last_status!r}")
              raise SystemExit(f"websocket upgrade failed: {last_error!r}")
          PY

          for attempt in {1..30}; do
            if pgrep -u "$(id -u)" -f xfce4-session >/dev/null && \
               pgrep -u "$(id -u)" -f xfwm4 >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          ps -ef | grep -E 'xfce4-session|xfwm4|xfdesktop|xfce4-panel' | grep -v grep || true
          sudo journalctl -u desktop-xfce.service --no-pager -n 100 || true
          exit 1

      - name: Install k3s on hosted VM
        run: |
          set -euo pipefail

          curl -sfL https://get.k3s.io | \
            sudo env INSTALL_K3S_EXEC="server --write-kubeconfig-mode=644" sh -

          mkdir -p "$HOME/.kube"
          sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          for attempt in {1..60}; do
            if KUBECONFIG="$HOME/.kube/config" kubectl get nodes 2>/dev/null | grep -q ' Ready'; then
              break
            fi
            sleep 2
          done

          KUBECONFIG="$HOME/.kube/config" kubectl wait \
            --for=condition=Ready node --all --timeout=120s

          echo 'export KUBECONFIG="$HOME/.kube/config"' >> "$HOME/.profile"

      - name: Verify development host
        run: |
          set -euo pipefail
          google-chrome --version
          code --version | head -n 1
          sudo systemctl is-active k3s
          KUBECONFIG="$HOME/.kube/config" kubectl get nodes -o wide
          sudo systemctl is-active desktop-x.service
          sudo systemctl is-active desktop-xfce.service
          sudo systemctl is-active desktop-novnc.service
          sudo systemctl is-active nginx

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Configure target repository runner
        env:
          RUNNER_TARGET_REPOSITORY: ${{ secrets.RUNNER_TARGET_REPOSITORY }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          RUNNER_VERSION="$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name | ltrimstr("v")')"
          RUNNER_DIR="$RUNNER_TEMP/target-runner"
          mkdir -p "$RUNNER_DIR"
          cd "$RUNNER_DIR"

          curl -fsSL -o actions-runner.tar.gz \
            "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
          tar xzf actions-runner.tar.gz

          REGISTRATION_TOKEN="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${RUNNER_ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${RUNNER_TARGET_REPOSITORY}/actions/runners/registration-token" \
            | jq -r '.token')"

          ./config.sh \
            --unattended \
            --replace \
            --disableupdate \
            --url "https://github.com/${RUNNER_TARGET_REPOSITORY}" \
            --token "$REGISTRATION_TOKEN" \
            --name "flutter-native-webm-desktop-${GITHUB_RUN_ID}" \
            --labels webm-integration,ephemeral-linux \
            --work _work

      - name: Start target repository runner
        id: target-runner
        working-directory: ${{ runner.temp }}/target-runner
        run: ./run.sh
        background: true

      - name: Desktop URL
        env:
          HOLD_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_minutes || '10' }}
        run: |
          set -euo pipefail
          case "$HOLD_MINUTES" in
            ''|*[!0-9]*) echo "::error::hold_minutes must be an integer"; exit 1 ;;
          esac
          if [ "$HOLD_MINUTES" -lt 1 ] || [ "$HOLD_MINUTES" -gt 340 ]; then
            echo "::error::hold_minutes must be between 1 and 340"
            exit 1
          fi

          echo "The temporary desktop URL will appear below."
          echo "Authenticate with user: admin"
          echo "Manual branch smoke: choose this branch and set hold_minutes=10."
          set +e
          timeout --signal=TERM "${HOLD_MINUTES}m" \
            cloudflared tunnel --url http://127.0.0.1:3000
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - cancel: target-runner

      - name: Remove target repository runner registration
        if: always()
        env:
          RUNNER_TARGET_REPOSITORY: ${{ secrets.RUNNER_TARGET_REPOSITORY }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          set +e
          RUNNER_DIR="$RUNNER_TEMP/target-runner"
          if [ ! -d "$RUNNER_DIR" ]; then
            echo "Target runner directory was never created; skipping deregistration."
            exit 0
          fi
          cd "$RUNNER_DIR"

          REMOVE_TOKEN="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${RUNNER_ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${RUNNER_TARGET_REPOSITORY}/actions/runners/remove-token" \
            | jq -r '.token')"
          ./config.sh remove --token "$REMOVE_TOKEN"

      - name: Stop development services
        if: always()
        run: |
          sudo systemctl stop desktop-novnc.service desktop-xfce.service desktop-x.service nginx k3s 2>/dev/null || true
